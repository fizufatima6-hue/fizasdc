<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TechFest 2025 · College Event Gallery</title>
    <style>
        /* ---------- Base ---------- */
        * { box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f2f5f9;
            color: #1c2b3a;
            margin: 0;
            padding: 2.2rem 1.2rem 3rem;
            line-height: 1.55;
        }

        /* ---------- Page heading ---------- */
        header.page-header {
            max-width: 1120px;
            margin: 0 auto 2.2rem;
            text-align: center;
        }
        header.page-header h1 {
            font-size: 2rem;
            font-weight: 600;
            color: #0b2e4f;
            margin: 0 0 0.3rem;
            letter-spacing: -0.4px;
        }
        header.page-header p {
            margin: 0;
            color: #5a6f85;
            font-size: 0.98rem;
        }

        /* ---------- Gallery grid ---------- */
        .gallery {
            max-width: 1120px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 1.6rem;
            list-style: none;
            padding: 0;
        }

        /* ---------- Figure (image + caption card) ---------- */
        figure.event-card {
            margin: 0;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid #e2eaf3;
            box-shadow: 0 5px 16px rgba(15, 40, 70, 0.07);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }
        figure.event-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 26px rgba(15, 40, 70, 0.14);
        }

        /* ---------- Image wrapper with fixed aspect ratio ---------- */
        .img-wrap {
            position: relative;
            width: 100%;
            aspect-ratio: 4 / 3;    /* reserves space — prevents layout shift */
            background: #dfe8f2;
            overflow: hidden;
        }
        .img-wrap img {
            width: 100%;
            height: 100%;
            object-fit: cover;       /* fills the box without distortion */
            display: block;
        }

        /* ---------- Caption ---------- */
        figcaption {
            padding: 0.85rem 1rem 1.05rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.2rem;
        }
        figcaption .title {
            font-weight: 600;
            font-size: 0.98rem;
            color: #0b2e4f;
        }
        figcaption .meta {
            font-size: 0.8rem;
            color: #7186a0;
        }

        /* ---------- Focus outline for keyboard users ---------- */
        .event-link:focus-visible {
            outline: 3px solid #1f6fd0;
            outline-offset: 3px;
            border-radius: 16px;
        }
        .event-link {
            text-decoration: none;
            color: inherit;
            display: block;
            border-radius: 16px;
        }

        /* ---------- Reduced motion preference ---------- */
        @media (prefers-reduced-motion: reduce) {
            figure.event-card { transition: none; }
            figure.event-card:hover { transform: none; }
        }
    </style>
</head>
<body>

    <!-- ============ PAGE HEADER ============ -->
    <header class="page-header">
        <h1>TechFest 2025 · College Event Gallery</h1>
        <p>Highlights from the annual three-day technology festival — 12–14 March 2025</p>
    </header>

    <!-- ============================================================
         GALLERY — a semantic list of <figure> elements.
         Each <figure> wraps:
           - <img>  : with descriptive alt text (what a sighted user sees)
           - <figcaption> : visible caption (title + metadata)

         KEY ACCESSIBILITY POINTS:
           - alt describes CONTENT, not "image of..."
           - Images use aspect-ratio + object-fit (no layout shift,
             no distortion), and are responsive in the grid
           - Decorative-only images would use alt="" (omitted here —
             every photo carries meaning for the event recap)
           - Each figure is wrapped in a focusable link so keyboard
             users can open the full-size photo
         ============================================================ -->
    <ul class="gallery">

        <!-- ---------- 1 · Opening ceremony ---------- -->
        <li>
            <a class="event-link" href="#photo-opening-ceremony">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/1011/800/600"
                            alt="Students and faculty seated in the college auditorium during the TechFest 2025 opening ceremony, with a banner reading 'TechFest 2025' on stage."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">Opening Ceremony</span>
                        <span class="meta">Auditorium · 12 March · 9:00 AM</span>
                    </figcaption>
                </figure>
            </a>
        </li>

        <!-- ---------- 2 · Coding hackathon ---------- -->
        <li>
            <a class="event-link" href="#photo-hackathon">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/0/800/600"
                            alt="Four students wearing headphones and typing on laptops at a long table during the 24-hour coding hackathon, with a timer screen in the background."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">24-Hour Coding Hackathon</span>
                        <span class="meta">Computer Lab 2 · 12 March · Overnight</span>
                    </figcaption>
                </figure>
            </a>
        </li>

        <!-- ---------- 3 · Robotics demo ---------- -->
        <li>
            <a class="event-link" href="#photo-robotics">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/180/800/600"
                            alt="A student demonstrating a small wheeled robot to a crowd in the college courtyard, pointing at the robot while visitors look on."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">Robotics Demo</span>
                        <span class="meta">Main Courtyard · 13 March · 11:30 AM</span>
                    </figcaption>
                </figure>
            </a>
        </li>

        <!-- ---------- 4 · Keynote talk ---------- -->
        <li>
            <a class="event-link" href="#photo-keynote">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/20/800/600"
                            alt="A guest speaker on stage presenting slides about artificial intelligence to a full hall of students, with a large projection screen behind her."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">Keynote: AI in Everyday Life</span>
                        <span class="meta">Seminar Hall · 13 March · 2:00 PM</span>
                    </figcaption>
                </figure>
            </a>
        </li>

        <!-- ---------- 5 · Cultural night ---------- -->
        <li>
            <a class="event-link" href="#photo-cultural-night">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/1069/800/600"
                            alt="Students performing a group dance on an illuminated open-air stage during the TechFest cultural night, with colorful lighting and an audience in the foreground."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">Cultural Night</span>
                        <span class="meta">Open-Air Stage · 13 March · 7:00 PM</span>
                    </figcaption>
                </figure>
            </a>
        </li>

        <!-- ---------- 6 · Award ceremony ---------- -->
        <li>
            <a class="event-link" href="#photo-awards">
                <figure class="event-card">
                    <div class="img-wrap">
                        <img
                            src="https://picsum.photos/id/42/800/600"
                            alt="The college principal handing a trophy and certificate to a smiling student on stage, with other finalists applauding in the background."
                            width="800"
                            height="600"
                            loading="lazy">
                    </div>
                    <figcaption>
                        <span class="title">Prize Distribution</span>
                        <span class="meta">Auditorium · 14 March · 4:30 PM</span>
                    </figcaption>
                </figure>
            </a>
        </li>

    </ul>

</body>
</html>
